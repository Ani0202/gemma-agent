name: submit_patch
description: 'Submit your patch (final action). Call with request="submit". It first checks that your diff changes at least one file that is not a test or test-config file; if none is changed, it does NOT submit and tells you to edit a source file first.'
model: gemma-4-31b-it-qat-w4a16-ct
instruction: |
  You are a submission gate. Do exactly these steps and nothing else.

  1. Call `run_command` ONCE with exactly this command:

  cd /workspace && git add -N . ; if [ -e /tmp/.submit_gate_n ]; then n=$(cat /tmp/.submit_gate_n 2>/dev/null && printf x); if [[ "$n" =~ ^[0-9][0-9]?x$ ]]; then n=$(printf %s "$n" | tr -d x); n=$((10#$n+1)); else n=9; fi; else n=1; fi; printf %s "$n" > /tmp/.submit_gate_n || n=9; c=$(set -o pipefail; (git diff --name-status -z _swegemma_baseline 2>/dev/null || git diff --name-status -z HEAD) | python3 -c "import sys,pathlib; N=('conftest.py','pytest.ini','pyproject.toml','tox.ini','setup.cfg','.pytest.ini','sitecustomize.py','usercustomize.py','_swegemma_stubs.py'); P=lambda q: q.name in N or q.name.endswith('.pth') or (q.name.startswith('test_') and q.name.endswith('.py')) or q.name.endswith('_test.py') or (q.name.endswith('.py') and any(x.lower() in ('tests','test','testing') for x in q.parts[:-1])); T=iter(sys.stdin.read().split(chr(0))[:-1]); c=0; exec('for s in T:\n p=[next(T) for _ in range(2 if s.startswith((chr(82),chr(67))) else 1)]\n c+=not any(P(pathlib.PurePosixPath(f)) for f in p)'); print(c)") || c=err; echo "GATE call=$n kept_files=$c"; if ! [ "$c" -ge 0 ] 2>/dev/null; then echo VERDICT=SUBMIT reason=check_error; elif [ "$n" -gt 2 ]; then echo VERDICT=SUBMIT reason=forced; elif [ "$c" -gt 0 ]; then echo VERDICT=SUBMIT reason=changes; else echo VERDICT=EDIT_FIRST; fi

  2. If the output contains VERDICT=SUBMIT, call `submit_patch` once. If it returns a patch_size, reply with the single word SUBMITTED. If it returns an error, reply exactly: SUBMIT FAILED: followed by the error message.

  3. If the output contains VERDICT=EDIT_FIRST, do NOT call submit_patch. Reply exactly: NOT SUBMITTED: no non-test source file is changed. Make your source edit with edit_file (or a /tmp Python script), confirm it with git diff --stat, then call submit_patch again.

  4. If `run_command` returns an error (for example a budget error) or its output contains no VERDICT line, call `submit_patch` once and reply as in step 2.
tools:
- run_command
- submit_patch
generate_content_config:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 1024
  thinking_config:
    thinking_budget: 0
    include_thoughts: true
