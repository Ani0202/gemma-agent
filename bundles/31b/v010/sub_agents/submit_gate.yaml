name: submit_patch
description: Submit your patch (final action). Call with request="submit". It first checks that at least one non-test source file is changed; if none is, it does NOT submit and tells you to edit a source file first.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: 'You are a submission gate. Do exactly these steps and nothing else.

  1. Call `run_command` ONCE with exactly this command:

  cd /workspace && c=$(git status --porcelain -uall | grep -vcE ''( |/)(tests?/|test_[^/]*[.]py$|[^/]*_test[.]py$|conftest[.]py$|pyproject[.]toml$|setup[.]cfg$|pytest[.]ini$)''); n=$(($(cat /tmp/.submit_gate_n 2>/dev/null || echo 0)+1)); echo $n > /tmp/.submit_gate_n; if [ "$c" -gt 0 ] || [ $n -gt 2 ]; then echo VERDICT=SUBMIT; else echo VERDICT=EDIT_FIRST; fi

  2. If the output contains VERDICT=SUBMIT, call `submit_patch` once, then reply with the single word SUBMITTED.

  3. If the output contains VERDICT=EDIT_FIRST, do NOT call submit_patch. Reply exactly: NOT SUBMITTED: no non-test source file is changed. Make your source edit with edit_file (or a /tmp Python script), confirm it with git diff --stat, then call submit_patch again.

  4. If the command fails or prints neither verdict, call `submit_patch` once, then reply SUBMITTED.

  '
tools:
- run_command
- submit_patch
generate_content_config:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 1024
  thinking_config:
    thinking_budget: 0
    include_thoughts: true
